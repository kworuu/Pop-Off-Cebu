{% extends "base.html" %}
{% load static %}

{% block title %}Login | Pop-off Cebu{% endblock %}

{% block content %}
<div class="window-card form-window">
    <div class="window-header">
        <span>AUTH_LOGIN.EXE</span>
        <div class="window-controls">
            <span class="window-dot min"></span>
            <span class="window-dot max"></span>
            <span class="window-dot close"></span>
        </div>
    </div>
    <div class="window-body">
        <h2>Member Sign In</h2>
        <div class="form-subtitle">Access your Pop-off Cebu account & portal</div>

        <form method="post">
            {% csrf_token %}
            <div style="margin-bottom: 14px;">
                <label for="id_username">Username</label>
                <input type="text" name="username" id="id_username" class="form-input" required autofocus>
            </div>

            <div style="margin-bottom: 14px;">
                <label for="login-password">Password</label>
                <div style="display: flex; gap: 8px;">
                    <input type="password" name="password" id="login-password" class="form-input" required>
                    <button type="button" class="button secondary btn-pwd-toggle" style="padding: 0 12px; font-size: 11px;">SHOW</button>
                </div>
            </div>

            <div style="margin-top: 24px;">
                <button type="submit" class="button primary-green full-width">Sign In</button>
            </div>
        </form>

        <div class="form-footer">
            No account yet? <a href="{% url 'register:register' %}">Create an account here</a>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="{% static 'js/login.js' %}"></script>
{% endblock %}
